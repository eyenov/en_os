<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>EnOS · 一句英文，走完雅思四项</title>
  <meta name="description" content="输入一句英文、一段文章或一条新闻，按听力、阅读、口语、写作由易到难生成 8 个 5 分钟雅思学习任务，并输出学习报告。" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <a class="skip-link" href="#app">跳到主要内容</a>

  <header class="topbar">
    <a class="brand" href="#/home" aria-label="EnOS 首页">
      <span class="brand-mark" aria-hidden="true">
        <img src="/icon.svg" alt="" />
      </span>
      <span class="brand-word">EnOS<span class="brand-dot">.</span></span>
      <span class="brand-sub">雅思语境学习</span>
    </a>

    <nav class="nav" id="nav" aria-label="主导航">
      <a href="#/home" data-route="home">学习</a>
      <a href="#/listening" data-route="listening">听力</a>
      <a href="/videos.html" data-route="videos">视频</a>
      <a href="#/reports" data-route="reports">报告</a>
      <a href="#/settings" data-route="settings">设置</a>
    </nav>

    <div class="topbar-right">
      <button class="lookup-pill on" id="lookup-toggle" type="button" aria-pressed="true" title="取词已开启：鼠标停在英文单词上查看释义">
        <span class="lookup-mark" aria-hidden="true">译</span><span class="lookup-label">取词</span>
      </button>
      <button class="status-pill" id="status-pill" type="button" aria-label="打开 API 设置" title="当前生成方式">
        <span class="dot"></span><span id="status-text">本地引擎</span>
      </button>
      <a class="icon-btn" href="#/settings" aria-label="打开设置" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
        </svg>
      </a>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <footer class="site-foot">
    <div class="foot-left">
      <span class="foot-mark">EnOS</span>
      <span>本地优先 · 你的 API Key 只保存在这台设备</span>
    </div>
    <div class="foot-right">
      <a href="#/settings">API 设置</a>
      <span aria-hidden="true">·</span>
      <span>8 步 × 5 分钟</span>
    </div>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
