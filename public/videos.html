<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>学习工作台 · EnOS</title>
  <meta name="description" content="EnOS 学习工作台：视频、播客与英文阅读。" />
  <link rel="icon" href="/favicon.svg?v=knowledge-k" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=knowledge-k" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=knowledge-k" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/gridstack.min.css" />
  <link rel="stylesheet" href="/css/studio.css" />
</head>
<body class="studio-body">
  <a class="skip-link" href="#media-view">跳到学习内容</a>
  <div class="studio-shell">
    <aside class="studio-rail" aria-label="主导航">
      <nav class="studio-rail-nav">
        <div class="studio-media-tabs" role="tablist" aria-label="内容类型" aria-orientation="vertical">
          <button class="rail-btn studio-tab active" id="tab-youtube" type="button" role="tab" title="YouTube" aria-selected="true" aria-current="page" aria-controls="youtube-pane" data-tab="youtube"><span data-icon="play"></span><span>YouTube</span></button>
          <button class="rail-btn studio-tab" id="tab-podcast" type="button" role="tab" title="播客" aria-selected="false" aria-controls="podcast-pane" data-tab="podcast" tabindex="-1"><span data-icon="headphones"></span><span>播客</span></button>
          <button class="rail-btn studio-tab" id="tab-books" type="button" role="tab" title="图书" aria-selected="false" aria-controls="books-pane" data-tab="books" tabindex="-1"><span data-icon="book"></span><span>图书</span></button>
        </div>
        <button class="rail-btn tree-open-btn hidden" id="tree-open" type="button" aria-label="打开频道导航" aria-controls="channel-tree" aria-expanded="false" title="打开频道导航"><span data-icon="chevronRight"></span><span>频道</span></button>
      </nav>
      <button class="rail-btn rail-fullscreen" id="studio-fullscreen" type="button" title="进入全屏" aria-label="进入全屏" aria-pressed="false"><span data-icon="maximize"></span></button>
      <details class="rail-language" id="studio-language-menu">
        <summary class="rail-btn" title="界面语言" aria-label="界面语言"><span data-icon="globe"></span></summary>
        <div class="rail-language-popover"><label class="sr-only" for="studio-language">界面语言</label><select class="input" id="studio-language" data-locale-select><option value="zh-CN" translate="no">中文</option><option value="en" translate="no">English</option></select></div>
      </details>
      <button class="rail-btn rail-settings" id="rail-settings" type="button" title="设置" aria-label="设置"><span data-icon="settings"></span><span>设置</span></button>
    </aside>

    <div class="studio-main">
      <section class="studio-workspace" id="media-view" tabindex="-1">
        <aside class="channel-tree" id="channel-tree" aria-label="频道与内容导航">
          <div class="tree-head">
            <div>
              <p class="eyebrow" id="tree-eyebrow">频道</p>
              <h2 id="tree-title">频道</h2>
              <p id="tree-count">搜索后显示频道</p>
            </div>
            <button class="tree-collapse" id="tree-collapse" type="button" title="收起频道导航" aria-label="收起频道导航"><span data-icon="arrowLeft"></span></button>
          </div>
          <div class="tree-scroll" id="channel-list"></div>
        </aside>
        <button class="channel-scrim" id="channel-scrim" type="button" aria-label="关闭频道导航" tabindex="-1"></button>

        <section class="preview-pane" id="youtube-pane">
          <div class="preview-top">
            <form class="studio-search" id="video-search" role="search">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
              </svg>
              <label class="sr-only" for="video-q">搜索 YouTube 视频</label>
              <input id="video-q" name="q" type="search" placeholder="搜索频道或视频，例如 BBC Learning English" autocomplete="off" />
              <button class="btn btn-primary" type="submit"><span data-icon="search"></span>搜索</button>
            </form>
            <div class="preview-head">
              <div>
                <h1 id="preview-title">YouTube</h1>
                <p id="preview-subtitle">正在读取频道…</p>
              </div>
              <span class="preview-source" id="preview-source"></span>
            </div>
          </div>
          <div class="preview-scroll" id="video-results" aria-live="polite"></div>
        </section>

        <section class="podcast-pane hidden" id="podcast-pane" aria-labelledby="tab-podcast">
          <header class="podcast-top">
            <h1 id="podcast-title">播客</h1>
            <div class="podcast-title-actions">
              <button class="studio-icon-button shadowing-toggle" id="podcast-shadowing" type="button" title="开始语音跟读" aria-label="语音跟读" aria-pressed="false" disabled><span data-icon="mic"></span></button>
              <button class="studio-icon-button" id="podcast-details" type="button" title="详情信息" aria-label="详情信息" aria-haspopup="dialog" disabled><span data-icon="info"></span></button>
              <details class="sync-settings" id="podcast-sync-settings">
                <summary class="studio-icon-button" title="播放设置" aria-label="播放设置"><span data-icon="settings"></span></summary>
                <div class="sync-popover">
                  <label class="follow-control"><input id="podcast-follow" type="checkbox" checked /><span>跟随播放</span></label>
                  <label for="podcast-offset">字幕延迟（秒）</label>
                  <div class="sync-offset-row"><input id="podcast-offset" type="number" min="-3" max="3" step="0.05" value="0" title="正值延后字幕，负值提前字幕" /><button class="studio-icon-button" id="podcast-offset-reset" type="button" title="重置字幕延迟" aria-label="重置字幕延迟"><span data-icon="refresh"></span></button></div>
                  <button class="btn btn-soft btn-sm hidden" id="podcast-translate" type="button">重试翻译</button>
                </div>
              </details>
              <button class="studio-icon-button podcast-download" id="podcast-download" type="button" title="下载双语字幕（SRT）" aria-label="下载双语字幕" disabled><span data-icon="download"></span></button>
            </div>
          </header>
          <div class="podcast-player" id="podcast-player">
            <span class="sr-only" id="podcast-audio-state" role="status">尚未选择单集</span>
            <div class="podcast-transport">
              <button class="studio-icon-button" id="podcast-prev" type="button" title="上一句" aria-label="上一句" disabled><span data-icon="arrowLeft"></span></button>
              <button class="podcast-play" id="podcast-play" type="button" title="播放" aria-label="播放" disabled><span data-icon="play"></span></button>
              <button class="studio-icon-button" id="podcast-next" type="button" title="下一句" aria-label="下一句" disabled><span data-icon="arrowRight"></span></button>
            </div>
            <div class="podcast-clock"><span class="podcast-time" id="podcast-current">0:00</span><span aria-hidden="true">/</span><span class="podcast-time" id="podcast-duration">0:00</span></div>
            <div class="podcast-wave-wrap">
              <canvas id="podcast-wave" role="slider" tabindex="0" aria-label="播放进度"></canvas>
            </div>
            <label class="podcast-speed" title="播放速度"><span class="sr-only">播放速度</span><select id="podcast-speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
            <button class="studio-icon-button podcast-repeat" id="podcast-repeat" type="button" title="重听当前句" aria-label="重听当前句" disabled><span data-icon="refresh"></span></button>
            <audio id="podcast-audio" preload="metadata"></audio>
          </div>
          <div class="shadowing-bar hidden" id="podcast-shadowing-bar" aria-label="播客跟读"></div>
          <div class="podcast-subtitles">
            <span id="podcast-position" class="sr-only">00 / 00</span>
            <p id="podcast-status" class="sr-only" role="status">正在准备字幕</p>
            <div class="podcast-sub-columns">
              <div class="podcast-col" role="region" aria-label="英文字幕">
                <div class="podcast-col-scroll" id="podcast-en" aria-live="polite"></div>
              </div>
              <div class="podcast-col" role="region" aria-label="中文字幕">
                <div class="podcast-col-scroll" id="podcast-zh" aria-live="polite"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="video-detail hidden" id="video-detail">
          <div class="detail-head">
            <button class="detail-back" id="detail-back" type="button" title="返回视频列表" aria-label="返回视频列表"><span data-icon="arrowLeft"></span><span class="detail-button-label">视频列表</span></button>
            <div class="detail-head-main">
              <h1 id="detail-title">视频</h1>
              <span id="detail-meta"></span>
              <span id="detail-status" class="sr-only"></span>
            </div>
            <button class="btn btn-soft btn-sm hidden" id="detail-translate" type="button" title="重试翻译" aria-label="重试翻译"><span data-icon="refresh"></span><span class="detail-button-label">重试翻译</span></button>
            <button class="btn btn-soft btn-sm shadowing-toggle" id="detail-shadowing" type="button" title="开始语音跟读" aria-label="语音跟读" aria-pressed="false" disabled><span data-icon="mic"></span><span class="detail-button-label">跟读</span></button>
            <button class="btn btn-ghost btn-sm detail-export" id="detail-export" type="button" title="导出字幕" aria-label="导出字幕"><span data-icon="download"></span><span class="detail-button-label">导出字幕</span></button>
            <details class="detail-layout-menu" id="detail-layout-menu">
              <summary class="btn btn-ghost btn-sm" title="窗口布局" aria-label="窗口布局"><span data-icon="layout"></span></summary>
              <div class="detail-layout-popover" id="detail-layout-options" role="group" aria-label="窗口显示"></div>
            </details>
            <button class="btn btn-ghost btn-sm" id="detail-layout-reset" type="button" title="重置窗口布局" aria-label="重置窗口布局"><span data-icon="refresh"></span></button>
          </div>
          <div class="shadowing-bar hidden" id="detail-shadowing-bar" aria-label="视频跟读"></div>
          <div class="detail-body" id="detail-body">
            <div class="grid-stack detail-window-grid" id="detail-window-grid">
              <section class="grid-stack-item detail-panel" data-panel="video" gs-id="video" gs-x="0" gs-y="0" gs-w="6" gs-h="5" aria-label="视频窗口">
                <div class="grid-stack-item-content detail-panel-surface">
                  <div class="detail-panel-head"><button class="detail-panel-handle" type="button" title="拖动视频窗口；方向键移动，Shift + 方向键缩放" aria-label="移动视频窗口"><span data-icon="target"></span></button></div>
                  <div class="detail-video-slot">
                    <div class="detail-player-shell">
                      <div id="detail-player" class="detail-player-mount"></div>
                      <div id="detail-fallback" class="detail-fallback hidden"></div>
                      <span class="detail-silent-badge" aria-hidden="true">原声静音</span>
                    </div>
                  </div>
                </div>
              </section>
              <section class="grid-stack-item detail-panel" data-panel="agent" gs-id="agent" gs-x="0" gs-y="5" gs-w="6" gs-h="7" aria-label="Agent 对话窗口">
                <div class="grid-stack-item-content detail-panel-surface">
                  <div class="detail-panel-head"><button class="detail-panel-handle" type="button" title="拖动 Agent 窗口；方向键移动，Shift + 方向键缩放" aria-label="移动 Agent 窗口"><span data-icon="target"></span></button></div>
                  <div class="detail-agent" id="detail-agent">
                    <div class="detail-messages" id="detail-messages" aria-live="polite"></div>
                    <form class="detail-chat-form" id="detail-chat-form">
                      <textarea id="detail-chat-input" rows="2" maxlength="2000" placeholder="问 Agent：解释当前句 / 总结这段视频"></textarea>
                      <button class="btn btn-primary" id="detail-chat-send" type="submit" title="发送" aria-label="发送"><span data-icon="send"></span></button>
                    </form>
                  </div>
                </div>
              </section>
              <section class="grid-stack-item detail-panel" data-panel="en" gs-id="en" gs-x="6" gs-y="0" gs-w="3" gs-h="12" aria-label="英文字幕窗口">
                <div class="grid-stack-item-content detail-panel-surface">
                  <div class="detail-panel-head"><button class="detail-panel-handle" type="button" title="拖动英文字幕窗口；方向键移动，Shift + 方向键缩放" aria-label="移动英文字幕窗口"><span data-icon="target"></span></button></div>
                  <div class="detail-sub-scroll" id="detail-en" aria-live="polite"></div>
                </div>
              </section>
              <section class="grid-stack-item detail-panel" data-panel="zh" gs-id="zh" gs-x="9" gs-y="0" gs-w="3" gs-h="12" aria-label="中文字幕窗口">
                <div class="grid-stack-item-content detail-panel-surface">
                  <div class="detail-panel-head"><button class="detail-panel-handle" type="button" title="拖动中文字幕窗口；方向键移动，Shift + 方向键缩放" aria-label="移动中文字幕窗口"><span data-icon="target"></span></button></div>
                  <div class="detail-sub-scroll" id="detail-zh" aria-live="polite"></div>
                </div>
              </section>
            </div>
          </div>
          <span class="sr-only" id="detail-layout-status" role="status"></span>
        </section>

        <section class="books-pane hidden" id="books-pane" aria-labelledby="tab-books">
          <p id="books-subtitle" class="sr-only" role="status">正在读取 GitHub 图书目录…</p>
          <div class="books-grid" id="books-grid" aria-live="polite"></div>
        </section>

        <section class="book-reader hidden" id="book-reader">
          <div class="book-reader-head">
            <button class="detail-back" id="book-back" type="button"><span data-icon="arrowLeft"></span>图书列表</button>
            <div class="book-reader-title">
              <h1 id="book-title">图书</h1>
              <p id="book-meta"></p>
            </div>
            <div class="book-actions" id="book-actions"></div>
          </div>
          <div class="book-reader-body">
            <aside class="book-toc-panel">
              <p class="book-toc-title">目录</p>
              <div class="book-toc-scroll" id="book-toc"></div>
            </aside>
            <article class="book-content" id="book-content" aria-live="polite"></article>
          </div>
        </section>
      </section>

      <section class="settings-view hidden" id="settings-view" aria-label="设置" tabindex="-1"></section>

    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <dialog class="podcast-details-dialog" id="podcast-details-dialog" aria-labelledby="podcast-details-title">
    <div class="podcast-details-head"><h2 id="podcast-details-title">单集详情</h2><button class="studio-icon-button" id="podcast-details-close" type="button" title="关闭详情" aria-label="关闭详情" autofocus><span data-icon="close"></span></button></div>
    <div class="podcast-details-content" id="podcast-details-content"></div>
  </dialog>
  <script src="/js/gridstack-all.js"></script>
  <script type="module" src="/js/videos.js"></script>
</body>
</html>
