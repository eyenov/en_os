<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>视频工作台 · EnOS</title>
  <meta name="description" content="EnOS 视频工作台：按频道浏览 YouTube 视频，打开逐词双语字幕。" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/studio.css" />
</head>
<body class="studio-body">
  <div class="studio-shell">
    <aside class="studio-rail" aria-label="主导航">
      <a class="studio-brand" href="/videos.html" aria-label="EnOS 视频工作台">
        <svg viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="26" height="26" rx="8" fill="currentColor" />
          <path d="M8 18.5L12.2 10l4 8.5L21 8" stroke="#171510" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="21" cy="8" r="1.8" fill="#c9f27c"/>
        </svg>
      </a>
      <nav class="studio-rail-nav">
        <button class="rail-btn active" id="rail-videos" type="button" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="3"/>
            <path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/>
          </svg>
          <span>视频</span>
        </button>
        <button class="rail-btn" id="rail-chat" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2v-5.2a7.5 7.5 0 0 1-1-3.8A7.5 7.5 0 0 1 10.5 4h2.5a7.5 7.5 0 0 1 7.5 7.5z"/>
            <path d="M8 11h8M8 14h5"/>
          </svg>
          <span>对话</span>
        </button>
      </nav>
      <div class="studio-rail-foot" aria-hidden="true">ENOS · STUDIO</div>
    </aside>

    <div class="studio-main">
      <header class="studio-tabs" role="tablist" aria-label="内容类型">
        <button class="studio-tab active" id="tab-youtube" type="button" role="tab" aria-selected="true" data-tab="youtube">YouTube</button>
        <button class="studio-tab" id="tab-podcast" type="button" role="tab" aria-selected="false" data-tab="podcast">播客</button>
        <button class="studio-tab" id="tab-books" type="button" role="tab" aria-selected="false" data-tab="books">图书</button>
        <span class="studio-tabs-spacer"></span>
        <button class="tree-open-btn hidden" id="tree-open" type="button">频道</button>
      </header>

      <section class="studio-workspace" id="media-view">
        <aside class="channel-tree" id="channel-tree">
          <div class="tree-head">
            <div>
              <p class="eyebrow" id="tree-eyebrow">CHANNELS</p>
              <h2 id="tree-title">频道</h2>
              <p id="tree-count">搜索后显示频道</p>
            </div>
            <button class="tree-collapse" id="tree-collapse" type="button" title="收起频道导航" aria-label="收起频道导航">‹</button>
          </div>
          <div class="tree-scroll" id="channel-list"></div>
        </aside>

        <section class="preview-pane" id="youtube-pane">
          <div class="preview-top">
            <form class="studio-search" id="video-search" role="search">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
              </svg>
              <label class="sr-only" for="video-q">搜索 YouTube 视频</label>
              <input id="video-q" name="q" type="search" placeholder="搜索频道或视频，例如 BBC Learning English" autocomplete="off" />
              <button class="btn btn-primary" type="submit">搜索</button>
            </form>
            <div class="preview-head">
              <div>
                <h1 id="preview-title">YouTube</h1>
                <p id="preview-subtitle">正在读取频道…</p>
              </div>
              <span class="preview-source" id="preview-source"></span>
            </div>
          </div>
          <div class="preview-scroll" id="video-results" aria-live="polite"></div>
        </section>

        <section class="podcast-pane hidden" id="podcast-pane">
          <div class="podcast-top">
            <div class="podcast-cover-wrap">
              <img id="podcast-cover" alt="" />
            </div>
            <div class="podcast-info">
              <p class="eyebrow">PODCAST</p>
              <h1 id="podcast-title">从左侧选择一集播客</h1>
              <p id="podcast-meta">展开频道，选择一集开始精听</p>
              <p id="podcast-desc" class="podcast-desc"></p>
            </div>
          </div>
          <div class="podcast-player" id="podcast-player">
            <button class="podcast-play" id="podcast-play" type="button" aria-label="播放">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
            </button>
            <span class="podcast-time" id="podcast-current">0:00</span>
            <div class="podcast-wave-wrap">
              <canvas id="podcast-wave" role="slider" tabindex="0" aria-label="播放进度"></canvas>
            </div>
            <span class="podcast-time" id="podcast-duration">0:00</span>
            <audio id="podcast-audio" preload="metadata"></audio>
          </div>
          <div class="podcast-subtitles">
            <div class="podcast-sub-head">
              <div>
                <h2>同步字幕</h2>
                <p id="podcast-status">选择一集播客后加载字幕</p>
              </div>
              <button class="btn btn-soft btn-sm hidden" id="podcast-translate" type="button">重试翻译</button>
            </div>
            <div class="podcast-sub-columns">
              <div class="podcast-col">
                <div class="podcast-col-title">ENGLISH</div>
                <div class="podcast-col-scroll" id="podcast-en" aria-live="polite"></div>
              </div>
              <div class="podcast-col">
                <div class="podcast-col-title">中文</div>
                <div class="podcast-col-scroll" id="podcast-zh" aria-live="polite"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="video-detail hidden" id="video-detail">
          <div class="detail-head">
            <button class="detail-back" id="detail-back" type="button">← 视频列表</button>
            <div class="detail-head-main">
              <h1 id="detail-title">视频</h1>
              <p id="detail-meta"></p>
              <span id="detail-status" class="sr-only"></span>
            </div>
            <button class="btn btn-soft btn-sm hidden" id="detail-translate" type="button">重试翻译</button>
            <button class="btn btn-ghost btn-sm detail-export" id="detail-export" type="button">导出字幕</button>
          </div>
          <div class="detail-body" id="detail-body">
            <div class="detail-left" id="detail-left">
              <div class="detail-player-shell">
                <div id="detail-player" class="detail-player-mount"></div>
                <div id="detail-fallback" class="detail-fallback hidden"></div>
              </div>
              <div class="detail-agent" id="detail-agent">
                <div class="detail-messages" id="detail-messages" aria-live="polite"></div>
                <form class="detail-chat-form" id="detail-chat-form">
                  <textarea id="detail-chat-input" rows="2" maxlength="2000" placeholder="问 Agent：解释当前句 / 总结这段视频"></textarea>
                  <button class="btn btn-primary" id="detail-chat-send" type="submit">发送</button>
                </form>
              </div>
            </div>
            <button class="detail-resize" id="detail-resize" type="button" title="拖动调整视频宽度 · 双击重置" aria-label="拖动调整视频宽度"></button>
            <div class="detail-right">
              <div class="detail-sub-columns">
                <div class="detail-sub-col">
                  <div class="detail-col-title">ENGLISH</div>
                  <div class="detail-sub-scroll" id="detail-en" aria-live="polite"></div>
                </div>
                <div class="detail-sub-col">
                  <div class="detail-col-title">中文</div>
                  <div class="detail-sub-scroll" id="detail-zh" aria-live="polite"></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="books-pane hidden" id="books-pane">
          <div class="books-head">
            <div>
              <p class="eyebrow">LIBRARY</p>
              <h1>英语外刊</h1>
              <p id="books-subtitle">正在读取 GitHub 图书目录…</p>
            </div>
            <a class="books-source" href="https://github.com/hehonghui/awesome-english-ebooks" target="_blank" rel="noopener noreferrer">GitHub 源 ↗</a>
          </div>
          <div class="books-grid" id="books-grid" aria-live="polite"></div>
        </section>

        <section class="book-reader hidden" id="book-reader">
          <div class="book-reader-head">
            <button class="detail-back" id="book-back" type="button">← 图书列表</button>
            <div class="book-reader-title">
              <h1 id="book-title">图书</h1>
              <p id="book-meta"></p>
            </div>
            <div class="book-actions" id="book-actions"></div>
          </div>
          <div class="book-reader-body">
            <aside class="book-toc-panel">
              <p class="book-toc-title">目录</p>
              <div class="book-toc-scroll" id="book-toc"></div>
            </aside>
            <article class="book-content" id="book-content" aria-live="polite"></article>
          </div>
        </section>
      </section>

      <section class="chat-view hidden" id="chat-view">
        <div class="chat-shell">
          <div class="chat-messages" id="chat-messages" aria-live="polite"></div>
          <form class="chat-form" id="chat-form">
            <textarea id="chat-input" rows="2" maxlength="2000" placeholder="问 Agent：帮我解释这段英文…"></textarea>
            <button class="btn btn-primary" id="chat-send" type="submit">发送</button>
          </form>
        </div>
      </section>

      <section class="studio-empty hidden" id="tab-empty">
        <div>
          <p class="eyebrow" id="tab-empty-eyebrow">COMING SOON</p>
          <h2 id="tab-empty-title">图书暂未接入</h2>
          <p id="tab-empty-text">入口先保留在这里，后续可以接入英文图书与章节精读。</p>
        </div>
      </section>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/js/videos.js"></script>
</body>
</html>
