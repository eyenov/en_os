<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>学习报告 · EnOS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <header class="topbar no-print">
    <a class="brand" href="/" aria-label="返回 EnOS">
      <span class="brand-mark" aria-hidden="true">
        <img src="/icon.svg" alt="" />
      </span>
      <span class="brand-word">EnOS<span class="brand-dot">.</span></span>
      <span class="brand-sub">学习报告</span>
    </a>
    <div class="topbar-right">
      <a class="btn btn-ghost btn-sm" href="/">回到学习</a>
      <button class="btn btn-ghost btn-sm" type="button" id="print-btn">打印 / PDF</button>
      <button class="btn btn-primary btn-sm" type="button" id="export-btn">导出 JSON</button>
    </div>
  </header>

  <main id="report" class="app report-page" aria-live="polite"></main>

  <footer class="site-foot no-print">
    <div class="foot-left"><span class="foot-mark">EnOS</span><span>报告由本机数据生成 · 可打印存档</span></div>
    <div class="foot-right"><span>8 步 × 5 分钟</span></div>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="/js/report.js"></script>
</body>
</html>
