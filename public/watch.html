<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>视频播放 · EnOS</title>
  <link rel="icon" href="/favicon.svg?v=knowledge-k" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=knowledge-k" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=knowledge-k" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="watch-body">
  <header class="topbar">
    <a class="brand" href="/" aria-label="EnOS 首页">
      <span class="brand-mark" aria-hidden="true">
        <img src="/icon.svg" alt="" />
      </span>
      <span class="brand-word">EnOS<span class="brand-dot">.</span></span>
      <span class="brand-sub">逐词字幕</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="/#/home">学习</a>
      <a href="/#/listening">听力</a>
      <a href="/videos.html" class="active" aria-current="page">视频</a>
      <a href="/#/reports">报告</a>
      <a href="/#/settings">设置</a>
    </nav>
    <div class="topbar-right">
      <a class="btn btn-ghost btn-sm" id="back-to-search" href="/videos.html">返回搜索</a>
    </div>
  </header>

  <main class="app watch-page" id="watch">
    <div class="watch-head" id="watch-head">
      <h1>正在读取视频与字幕</h1>
    </div>
    <div class="watch-layout">
      <div class="watch-main">
        <section class="player-panel">
          <div class="player-shell">
            <div id="yt-player" class="player-mount"></div>
            <div id="player-fallback" class="player-fallback hidden"></div>
            <button class="player-resize" id="player-resize" type="button"
              title="拖动调整播放器大小 · 双击重置"
              aria-label="拖动调整播放器大小" aria-orientation="vertical"
              aria-valuemin="40" aria-valuemax="280" aria-valuenow="138"></button>
          </div>
        </section>

        <section class="agent-panel" id="agent-panel" aria-label="视频学习 Agent">
          <div class="agent-messages" id="agent-messages" aria-live="polite"></div>
          <form class="agent-form" id="agent-form">
            <textarea id="agent-input" rows="2" maxlength="2000" placeholder="问 Agent：这句话为什么用这个时态？"></textarea>
            <button class="btn btn-primary" id="agent-send" type="submit">发送</button>
          </form>
        </section>
      </div>

      <aside class="subtitle-panel" aria-label="双语字幕">
        <div class="subtitle-head">
          <div>
            <h2>双语字幕</h2>
            <p id="subtitle-status">正在加载字幕…</p>
          </div>
          <div class="subtitle-tools">
            <button class="btn btn-soft btn-sm hidden" id="translate-btn" type="button">重试翻译</button>
            <button class="btn btn-ghost btn-sm hidden" id="export-md" type="button" title="导出中英字幕 Markdown">导出 MD</button>
            <label class="sub-toggle"><input type="checkbox" id="auto-scroll" checked /> 自动滚动</label>
          </div>
        </div>
        <div class="subtitle-columns single" id="subtitle-columns">
          <div class="sub-col">
            <div class="sub-col-title"><span>EN</span> English <b class="sub-col-sep">·</b> <span class="zh-badge">中</span> 中文</div>
            <div class="sub-scroll" id="sub-en"></div>
          </div>
        </div>
        <div class="subtitle-foot">
          <span id="subtitle-hint">点击任意一句跳转 · 逐词高亮</span>
        </div>
      </aside>
    </div>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/js/watch.js"></script>
</body>
</html>
